[theme]
primaryColor = "#FF6B6B"  # Vibrant red for accents and interactions
backgroundColor = "#0E1117"  # Dark background for modern look
secondaryBackgroundColor = "#262730"  # Lighter dark for panels and sidebars
textColor = "#FAFAFA"  # Off-white for high readability
font = "sans serif"  # Clean, professional font

[server]
maxUploadSize = 200  # Allow larger file uploads (200MB)
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "auto"
